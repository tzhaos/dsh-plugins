name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    name: dsh-plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every package suite
        run: node scripts/check-all.mjs
